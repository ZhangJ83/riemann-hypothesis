name: ProofOpt round17 Fock namespace fix
on:
  push:
    branches: [proofopt/round17-real-refactor]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofopt-round17-fock-fix
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ZhangJ83/riemann-hypothesis'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: 2746005d8130ee6d0c82d771ec11d69521a65093
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact intended proof diff and protected files
        run: |
          set -euo pipefail
          git diff --check "$BASE"...HEAD
          git diff --exit-code "$BASE"...HEAD -- src/Challenge.lean comparator.json export-targets.txt
          test "$(git diff --name-only "$BASE"...HEAD | grep -c '^src/.*\.lean$')" -eq 3
          grep -F 'New.Fock.conjTranspose_signMatrix' src/New/Determinant/Exchange/NegativeIndices.lean
          ! grep -nE '(^|[[:space:]])Fock[.]conjTranspose_signMatrix' src/New/Determinant/Exchange/NegativeIndices.lean
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned dependencies and baseline cache
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          set -euo pipefail
          lake --version
          lake exe mathlib/cache get
          python3 scripts/tauceti-cache-get.py
          python3 scripts/ci-cache-get.py --baseline "$BASE"
      - name: Compile affected module and downstream target
        run: |
          set -euo pipefail
          /usr/bin/time -v lake build New.Determinant.Exchange.NegativeIndices 2>&1 | tee "$RUNNER_TEMP/round17-build.log"
          ! grep -F 'Unknown identifier `Fock.conjTranspose_signMatrix`' "$RUNNER_TEMP/round17-build.log""
          ! grep -E 'declaration uses .sorry.' "$RUNNER_TEMP/round17-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofopt-round17-fock-fix
          path: ${{ runner.temp }}/round17-build.log
          retention-days: 14
