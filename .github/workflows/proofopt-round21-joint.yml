name: ProofOpt round 21 joint quotient optimization
on:
  push:
    branches: [proofopt/round21-joint]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixtures:
    if: github.repository == 'ZhangJ83/riemann-hypothesis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: JS and kernel fixtures
        run: |
          set -euo pipefail
          node scripts/proofopt/parametric.cjs --self-test
          node scripts/proofopt/joint.cjs
          cat scripts/proofopt/ParametricCertificate.lean scripts/proofopt/ParametricFixtures.lean > "$RUNNER_TEMP/ParamTest.lean"
          lean "$RUNNER_TEMP/ParamTest.lean" 2>&1 | tee "$RUNNER_TEMP/param-fixtures.log"
          for i in 0 1 2 3; do grep -E "PROOFOPT_PARAM_PASS $i " "$RUNNER_TEMP/param-fixtures.log"; done
          for i in 4 5 6 7 8; do grep -E "PROOFOPT_PARAM_REJECT $i:" "$RUNNER_TEMP/param-fixtures.log"; done
          test "$(grep -c 'PROOFOPT_PARAM_PASS ' "$RUNNER_TEMP/param-fixtures.log")" = 4
          test "$(grep -c 'PROOFOPT_PARAM_REJECT ' "$RUNNER_TEMP/param-fixtures.log")" = 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofopt-round21-fixtures
          path: ${{ runner.temp }}/param-fixtures.log
  certify:
    if: github.repository == 'ZhangJ83/riemann-hypothesis'
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASE: 2746005d8130ee6d0c82d771ec11d69521a65093
      GRAPH_SHA: 5a1f971e33e3c0449137327e7ed46ae4d8742c31e4c0e8449525005d03c5591c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          test "$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)" = "$BASE"
      - uses: actions/download-artifact@v4
        with:
          name: proofopt-round19-census
          repository: ZhangJ83/riemann-hypothesis
          run-id: 45828687994
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/census
      - uses: actions/download-artifact@v4
        with:
          name: proofopt-readable-baseline
          repository: ZhangJ83/riemann-hypothesis
          run-id: 45755058155
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/historical
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build historical snapshot
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/base"
          lake exe mathlib/cache get
          python3 scripts/tauceti-cache-get.py
          status=0
          python3 scripts/ci-cache-get.py --baseline "$BASE" || status=$?
          case "$status" in 0|4) ;; *) exit 1 ;; esac
          lake build
      - name: Certify real applications and replay actual reference sets
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/param"
          mkdir -p "$P"
          REPORT="$(find "$RUNNER_TEMP/census" -name report.json -print -quit)"
          GRAPH="$(find "$RUNNER_TEMP/historical" -name kernel-graph.jsonl.gz -print -quit)"
          test -n "$REPORT" && test -n "$GRAPH"
          node scripts/proofopt/parametric.cjs --render "$REPORT" scripts/proofopt/ParametricCertificate.lean "$P/Real.lean"
          python3 scripts/proofopt/isolated_certify.py "$REPORT" "$P/Real.lean" "$RUNNER_TEMP/base" "$P"
          node --max-old-space-size=6144 scripts/proofopt/dag_scope.cjs "$GRAPH" "$GRAPH_SHA" "$P/scope"
          node --max-old-space-size=6144 scripts/proofopt/parametric.cjs --joint "$GRAPH" "$GRAPH_SHA" "$P/scope" "$REPORT" "$P/cert.json" "$P/replay.json"
          git -C "$RUNNER_TEMP/base" diff --exit-code HEAD -- src Challenge.lean comparator.json comparator export-targets.txt lakefile.toml lake-manifest.json lean-toolchain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofopt-round21-certified
          path: |
            ${{ runner.temp }}/param/case-*.log
            ${{ runner.temp }}/param/Real.lean
            ${{ runner.temp }}/param/cert.json
            ${{ runner.temp }}/param/replay.json
          retention-days: 14
