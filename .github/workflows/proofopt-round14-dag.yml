name: ProofOpt round 14 exact expression DAG
on:
  push:
    branches: [proofopt/round14-expression-dag]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dag:
    if: github.repository == 'ZhangJ83/riemann-hypothesis'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASE: 2746005d8130ee6d0c82d771ec11d69521a65093
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify historical proof and test scope engine
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dag"
          git diff --exit-code "$BASE" HEAD -- src Challenge.lean comparator.json comparator export-targets.txt lakefile.toml lake-manifest.json lean-toolchain
          node scripts/proofopt/test_snapshot.mjs
          node scripts/proofopt/snapshot_cli.mjs "$BASE" "$RUNNER_TEMP/dag"
          node scripts/proofopt/dag_scope.cjs --self-test
      - uses: actions/download-artifact@v4
        with:
          name: proofopt-readable-baseline
          repository: ZhangJ83/riemann-hypothesis
          run-id: 45755058155
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/historical
      - name: Reproduce five-root closure scope and audit independent totals
        run: |
          set -euo pipefail
          GRAPH="$(find "$RUNNER_TEMP/historical" -name kernel-graph.jsonl.gz -print -quit)"
          test -n "$GRAPH"
          node --max-old-space-size=6144 scripts/proofopt/dag_scope.cjs "$GRAPH" 5a1f971e33e3c0449137327e7ed46ae4d8742c31e4c0e8449525005d03c5591c "$RUNNER_TEMP/dag"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/dag/scope.json")); assert (d["declarations"],d["union_all"],d["union_project_excluding_roots"])==(887134,220703,49503),d'
      - name: Install exact Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned cache and verify source snapshot
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          set -euo pipefail
          lake --version
          lake exe mathlib/cache get
          python3 scripts/tauceti-cache-get.py
          status=0
          python3 scripts/ci-cache-get.py --baseline "$BASE" || status=$?
          case "$status" in
            0|4) ;;
            *) echo "Cache unavailable; refusing unbudgeted clean build"; exit 1 ;;
          esac
          lake build
          git diff --exit-code "$BASE" HEAD -- src Challenge.lean comparator.json comparator export-targets.txt lakefile.toml lake-manifest.json lean-toolchain
      - name: Typecheck and execute Lean normalization tests
        run: |
          set -euo pipefail
          lake env lean scripts/proofopt/KernelDag.lean
          lake env lean --run scripts/proofopt/KernelDag.lean --self-test
      - name: Measure reachable kernel expression DAG and exact twins
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout 100m lake env lean --tstack=400000 --run scripts/proofopt/KernelDag.lean "$RUNNER_TEMP/dag/dag.json" "$RUNNER_TEMP/dag/scope.tsv" "$RUNNER_TEMP/dag/modules.txt" riemannHypothesis riemannZeta_eq_zero_re LFunction_ne_zero_of_half_lt_re LFunction_eq_zero_re LFunction_eq_zero_re_of_isPrimitive 2>&1 | tee "$RUNNER_TEMP/dag/dag.log"
          python3 -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/dag/"; s=json.load(open(p+"scope.json")); d=json.load(open(p+"dag.json")); assert d["reachable_declarations"]==s["union_all"] and d["project_reachable_declarations_including_roots"]==s["union_project_including_roots"]; assert d["root_names"]==s["root_names"]; assert d["unions"][0]>=d["unions"][1]>=d["unions"][2]>0; assert len(d["per_root_flat_category_major"])==15'
          sha256sum "$RUNNER_TEMP/dag/dag.json" > "$RUNNER_TEMP/dag/dag.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofopt-round14-expression-dag
          path: ${{ runner.temp }}/dag
          retention-days: 14
